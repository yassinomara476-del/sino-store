<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SINO-STORE | الحساب</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>.auth{min-height:100vh;display:grid;place-items:center;padding:30px}.auth-card{width:min(460px,100%);background:linear-gradient(145deg,#091522,#050b13);border:1px solid #1c344b;border-radius:28px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.4)}.auth-card h1{margin:0 0 8px;font-size:30px}.auth-card p{color:#7e91a7;font-size:11px;line-height:1.8}.field{margin:12px 0}.field label{display:block;color:#a9b9ca;font-size:10px;margin-bottom:6px}.field input{width:100%;padding:12px;border-radius:11px;border:1px solid #1a3047;background:#050d15;color:#fff;outline:none}.tabs{display:flex;gap:6px;margin:20px 0}.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid #1a3047;background:#07111c;color:#8ca0b5;cursor:pointer}.tabs button.active{background:linear-gradient(135deg,#0c8ff2,#735cff);color:#fff;border:0}.auth-msg{min-height:18px;color:#6dc9ff;font-size:10px;margin-top:10px}.back-home{display:block;text-align:center;margin-top:18px;color:#71859a;font-size:10px}</style></head><body><div class="auth"><div class="auth-card"><a class="brand" href="index.html"><img src="assets/logo.png" alt=""><div><strong>SINO<span>-STORE</span></strong><small>Digital subscriptions & more</small></div></a><h1>حسابك في SINO-STORE</h1><p>سجّل دخولك لمتابعة الطلبات وإتمام الشراء، أو أنشئ حساباً جديداً في ثوانٍ.</p><div class="tabs"><button id="loginTab" class="active">تسجيل الدخول</button><button id="signupTab">إنشاء حساب</button></div><form id="form"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" minlength="6" required></div><div class="field" id="nameField" style="display:none"><label>الاسم</label><input id="name"></div><button class="btn primary full" id="submit">تسجيل الدخول</button><div class="auth-msg" id="msg"></div></form><a class="back-home" href="index.html">← العودة للمتجر</a></div></div><script>
const sb=supabase.createClient(SINO_SUPABASE.url,SINO_SUPABASE.key);let mode="login";const $=s=>document.querySelector(s);
function setMode(m){mode=m;$("#loginTab").classList.toggle("active",m==="login");$("#signupTab").classList.toggle("active",m==="signup");$("#nameField").style.display=m==="signup"?"block":"none";$("#submit").textContent=m==="signup"?"إنشاء الحساب":"تسجيل الدخول";$("#msg").textContent=""}
$("#loginTab").onclick=()=>setMode("login");$("#signupTab").onclick=()=>setMode("signup");
$("#form").onsubmit=async e=>{e.preventDefault();$("#msg").textContent="جاري المعالجة...";const email=$("#email").value.trim(),password=$("#password").value;let r;if(mode==="signup")r=await sb.auth.signUp({email,password,options:{data:{full_name:$("#name").value.trim()}}});else r=await sb.auth.signInWithPassword({email,password});if(r.error){$("#msg").textContent=r.error.message;return}$("#msg").textContent=mode==="signup"?"تم إنشاء الحساب. افحص بريدك إذا طُلب منك التأكيد.":"تم تسجيل الدخول.";setTimeout(()=>location.href=new URLSearchParams(location.search).get("next")==="checkout"?"index.html#cart":"index.html",700)}
</script></body></html>
