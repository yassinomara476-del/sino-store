<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SINO-STORE | تسجيل الدخول</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><div class="auth-card"><a class="brand auth-brand" href="index.html"><img src="assets/logo.png" alt=""><span><b>SINO</b>-STORE<small>Digital Subscriptions</small></span></a><span class="eyebrow">WELCOME BACK</span><h1>تسجيل الدخول</h1><p class="muted">ادخل لحسابك لمتابعة طلباتك والمفضلة.</p><form id="loginForm"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" required><button class="primary" type="submit">دخول</button></form><p class="auth-switch">ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p><small class="demo-note">واجهة Frontend تجريبية فقط — لا تستخدم كلمات مرور حقيقية قبل ربط Backend/Auth.</small></div></main><script>document.getElementById("loginForm").addEventListener("submit",e=>{e.preventDefault();const email=document.getElementById("email").value.trim();const u=JSON.parse(localStorage.getItem("sino-user")||"null");if(u&&u.email===email){localStorage.setItem("sino-session","1");location.href="account.html"}else{alert("الحساب غير موجود في النسخة التجريبية. أنشئ حسابًا أولاً.");}});</script></body></html>
