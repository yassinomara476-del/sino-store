<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SINO-STORE | إنشاء حساب</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><div class="auth-card"><a class="brand auth-brand" href="index.html"><img src="assets/logo.png" alt=""><span><b>SINO</b>-STORE<small>Create account</small></span></a><span class="eyebrow">NEW CUSTOMER</span><h1>إنشاء حساب</h1><p class="muted">اعمل حساب واحفظ بياناتك وطلباتك في مكان واحد.</p><form id="registerForm"><input id="name" placeholder="الاسم" required><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" minlength="6" required><button class="primary" type="submit">إنشاء الحساب</button></form><p class="auth-switch">عندك حساب؟ <a href="login.html">تسجيل الدخول</a></p><small class="demo-note">النسخة الحالية Frontend Prototype. التفعيل الآمن للحسابات يحتاج Supabase/Auth أو Backend.</small></div></main><script>document.getElementById("registerForm").addEventListener("submit",e=>{e.preventDefault();const u={name:document.getElementById("name").value.trim(),email:document.getElementById("email").value.trim(),password:document.getElementById("password").value};localStorage.setItem("sino-user",JSON.stringify(u));localStorage.setItem("sino-session","1");location.href="account.html";});</script></body></html>
