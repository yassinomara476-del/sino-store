<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SINO-STORE | حسابي</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>.account-page{min-height:100vh;padding:40px 0}.account-box{border:1px solid #193047;background:#07111b;border-radius:22px;padding:22px;margin-top:18px}.order{display:grid;grid-template-columns:1fr auto auto;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid #172a40}.order:last-child{border-bottom:0}.order small{display:block;color:#71859b;font-size:9px;margin-top:4px}.status{padding:6px 9px;border-radius:99px;background:#101e2d;color:#9fc4de;font-size:8px}.account-actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main class="account-page"><div class="container"><a class="brand" href="index.html"><img src="assets/logo.png"><div><strong>SINO<span>-STORE</span></strong><small>MY ACCOUNT</small></div></a><div class="account-box"><div class="account-actions"><a class="btn primary" href="index.html">متابعة التسوق</a><a class="btn" href="admin.html">لوحة الإدارة</a><button class="btn" id="logout">تسجيل الخروج</button></div></div><div class="account-box"><h2>طلباتي</h2><div id="orders">جاري التحميل...</div></div></div></main><script>
const sb=supabase.createClient(SINO_SUPABASE.url,SINO_SUPABASE.key),$=s=>document.querySelector(s);
async function init(){const u=await sb.auth.getUser();if(!u.data.user){location.href="login.html";return}const r=await sb.from("orders").select("*").order("created_at",{ascending:false});if(r.error){$("#orders").textContent=r.error.message;return}$("#orders").innerHTML=r.data.length?r.data.map(o=>'<div class="order"><div><b>طلب #'+o.id.slice(0,8)+'</b><small>'+new Date(o.created_at).toLocaleString("ar-EG")+'</small></div><strong>'+Number(o.total).toLocaleString()+' ج.م</strong><span class="status">'+o.status+'</span></div>').join(""):'<p>لا توجد طلبات حتى الآن.</p>'}
$("#logout").onclick=async()=>{await sb.auth.signOut();location.href="index.html"};init();
</script></body></html>
